name: Deploy pipeline scripts

# Syncs pipeline-scripts/ to S3 (which is what the Glue jobs actually read
# their code from - they point at a fixed S3 path, so overwriting the
# object there is enough to update job behavior, no `glue update-job`
# call needed) and refreshes the Step Functions state machine definition.
#
# This is intentionally NOT a full infrastructure deploy. It uses the
# hdb-pipeline-github-actions IAM role, which setup.sh scopes narrowly:
# S3 access to the pipeline-scripts bucket only, glue:StartJobRun/GetJobRun/
# GetJob, sns:Publish, and states:DescribeStateMachine/UpdateStateMachine.
# It cannot create/update S3 buckets, Glue job definitions, Lambda, IAM
# roles, or EventBridge rules - that still requires running
# infrastructure_files/03_bash_scripts/setup.sh by hand with full
# credentials.

on:
  push:
    branches: [main]
    paths:
      - "pipeline-scripts/**"
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC -> AssumeRoleWithWebIdentity
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "544795558120"
  PROJECT_NAME: hdb-eventdriven
  PIPELINE_BUCKET: mission-hdb-eventdriven-544795558120-pipeline-scripts
  PIPELINE_PREFIX: python-scripts
  AUDIT_BUCKET: mission-hdb-eventdriven-544795558120-audit-tables
  STATE_MACHINE_NAME: hdb-eventdriven-pipeline
  STEPFUNCTIONS_ROLE_NAME: hdb-eventdriven-stepfunctions-role
  LAMBDA_FUNCTION_NAME: mission-hdb-eventdriven-metadata-reader
  SNS_TOPIC_NAME: hdb-eventdriven-notifications
  GLUE_JOB_COMPACT: hdb-job-0-compact-metadata
  GLUE_JOB_2: hdb-job-2-raw-iceberg
  GLUE_JOB_2B: hdb-job-2b-data-profiling
  GLUE_JOB_3: hdb-job-3-cleaned-iceberg
  GLUE_JOB_4: hdb-job-4-transformed-iceberg
  GLUE_JOB_5: hdb-job-5-hashed-iceberg
  SES_RECIPIENT_EMAILS: ""
  SES_SENDER_EMAIL: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC token claims
        run: |
          RESPONSE="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          export RESPONSE
          python3 -c "
          import base64, json, os
          resp = json.loads(os.environ['RESPONSE'])
          token = resp['value']
          payload_b64 = token.split('.')[1]
          payload_b64 += '=' * (-len(payload_b64) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload_b64))
          for key in ('sub', 'aud', 'iss', 'repository', 'repository_owner', 'ref'):
              print(f'{key}: {claims.get(key)}')
          "

      - name: Configure AWS credentials (OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/hdb-pipeline-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync pipeline-scripts to S3
        run: |
          aws s3 sync \
            pipeline-scripts/ \
            "s3://${PIPELINE_BUCKET}/${PIPELINE_PREFIX}/" \
            --delete \
            --exclude "*__pycache__*" \
            --exclude "*.pyc" \
            --exclude "*.ipynb_checkpoints*"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild state machine definition
        run: |
          SNS_TOPIC_ARN="arn:aws:sns:${AWS_REGION}:${AWS_ACCOUNT_ID}:${SNS_TOPIC_NAME}"
          LAMBDA_ARN="arn:aws:lambda:${AWS_REGION}:${AWS_ACCOUNT_ID}:function:${LAMBDA_FUNCTION_NAME}"
          STEPFUNCTIONS_ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${STEPFUNCTIONS_ROLE_NAME}"
          DEFINITION_FILE="$(mktemp)"

          python pipeline-scripts/05_ETL/build_state_machine_definition.py \
            "${SNS_TOPIC_ARN}" \
            "${LAMBDA_ARN}" \
            "${GLUE_JOB_COMPACT}" \
            "${GLUE_JOB_2}" "${GLUE_JOB_2B}" "${GLUE_JOB_3}" "${GLUE_JOB_4}" "${GLUE_JOB_5}" \
            "${SES_SENDER_EMAIL}" "${SES_RECIPIENT_EMAILS}" \
            "${AUDIT_BUCKET}" \
            "${DEFINITION_FILE}"

          aws stepfunctions update-state-machine \
            --state-machine-arn "arn:aws:states:${AWS_REGION}:${AWS_ACCOUNT_ID}:stateMachine:${STATE_MACHINE_NAME}" \
            --definition "file://${DEFINITION_FILE}" \
            --role-arn "${STEPFUNCTIONS_ROLE_ARN}"

          rm -f "${DEFINITION_FILE}"